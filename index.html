<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initia l-scale=1">
  <title>부산시내버스 분실물 조회</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 20px; }
.header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  justify-content: flex-start;
}

li {
  margin-bottom: 16px;
  font-size: 16.5px;
  line-height: 1.7;
  word-break: keep-all;        /* 단어 중간 줄바꿈 방지 */
}

.logo {
  max-width: 250px;
  height: auto;
}
  input, button { padding: 10px; font-size: 18px; border-radius: 6px; }
  input { width: 50%; border: 1px solid #aaa; }
  button { background: #0078d4; color: #fff; border: 0; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 16px; table-layout: auto; }
  th, td { border: 1px solid #ccc; padding: 10px; }
  th { background: #f0f0f0; }

  /* ✳️ 운수사/전화번호 줄바꿈 방지 */
  td:first-child, td:nth-child(2) {
    white-space: nowrap;
    min-width: 120px;
    max-width: 200px;
  }

  a.tel-link { color: #0078d4; text-decoration: underline; font-weight: bold; }
  .error { margin-top: 24px; color: red; font-weight: bold; }
</style>
</head>
<body>
  <div class="header">
  <img src="logo.svg" alt="부산광역시버스운송사업조합 로고" class="logo"></div>
  <h2>버스번호로 분실물 찾기</h2>
  <input id="no" maxlength="6" placeholder="예) 40 / 129-1 / 1003" onkeydown="if(event.key==='Enter')go()">
  <br>
  <button onclick="go()">조회</button>
  <div id="r"></div>

 <div style="margin-top: 30px; text-align: left; background: #f9f9f9; border: 1px solid #ccc; padding: 15px; font-size: 15px; line-height: 1.6; border-radius: 8px;">
  <h2 style="font-size: 20px; margin-bottom: 10px;">
  📌 분실물을 찾으려면 이렇게 해 주세요</h2>
    <ol style="padding-left: 20px;">
      <li style="margin-bottom: 16px; font-size: 16.5px; line-height: 1.7;">
      <strong>정확한 버스번호</strong> (예: 1003, 129-1 등 <strong>버스번호</strong>)을 입력해 주세요.
    </li>
    <li style="margin-bottom: 16px; font-size: 16.5px; line-height: 1.7;">
      여객사 연락처가 나오면, 전화를 걸어 <strong>분실물, 탑승 시간, 방향(출발-도착지), 좌석 위치</strong> 등 기억나는 정보를 알려 주세요.
    </li>
     <li style="font-size: 16.5px; line-height: 1.7;">
      결과가 안 나오거나 추가 문의 사항 있으시다면 아래로 문의해 주세요. 친절히 응대하겠습니다.
    </li>
  </ol>

<h3 style="text-align: center;">
  📞 <strong>부산광역시버스운송사업조합</strong><br>
  <a href="tel:0517914500" style="color: #0078d4; font-weight: bold;">051-791-4500</a>
</h3></div>
  

<script>
async function go(){
  const input = document.getElementById('no');
  const no = input.value.trim();
  const rDiv = document.getElementById('r');
  rDiv.innerHTML = '';

  // 정규식: 1~4자리 숫자 or 숫자-숫자 조합
  if (!/^[0-9]{1,4}(-[0-9]{1,2})?$/.test(no)) {
    rDiv.innerHTML = '<div class="error">숫자 1~4자리 또는 하이픈 포함(예: 55-1, 1003) 형식으로 입력하세요.</div>';
    return;
  }

  const url = `https://homeapi.busanbus.or.kr/busanbus-backend/v1/routes?routeNumber=${encodeURIComponent(no)}`;
  try {
    const j = await fetch(url).then(r => r.json());
    const comps = j.data[0]?.companies;
    if (!comps || comps.length === 0) throw 0;

    let html = `
      <table>
        <tr><th>운수사</th><th>전화번호</th><th>주소</th></tr>
    `;
    comps.forEach(c => {
      // 회사명: headName + name, 단 headName 없으면 name만
      const companyName = c.headName ? `${c.headName} ${c.name}` : c.name;
      html += `<tr>
        <td>${companyName}</td>
        <td><a href="tel:${c.representativePhone}" class="tel-link">${c.representativePhone}</a></td>
        <td>${c.address}</td>
      </tr>`;
    });
    html += '</table>';
    rDiv.innerHTML = html;
  } catch (e) {
    rDiv.innerHTML = '<div class="error">⚠️ 해당 버스번호를 찾을 수 없습니다.</div>';
  }
}
</script>
</body>
</html>
